[/Script/GameFeaturePluginsManagerEditor.GfpmSwitcherEditorSubsystem]
SwitcherWidgetClass=/GameFeaturePluginsManager/UI/WBP_GfpmSwitcher.WBP_GfpmSwitcher_C

[/Script/GameFeaturePluginsManagerEditor.GfpmPackageEditorSubsystem]
ProjectReleaseVersion=1.0
ModCookArguments=-pak -iostore -compressed -nop4 -utf8output -unattended -waitmutex -nocompileeditor -nodebuginfo -skipbuild -nocompile -cook -stage -archive -DLCIncludeEngineContent -DLCPakPluginFile -VersionCookedContent
; Project must full-cook (no -iterativecooking): the game-feature exclusion only applies to the cook set, so an incremental cook reuses a sandbox a prior inline package may have filled with game-feature content, leaking it into project and emptying every mod
ProjectCookArguments=-build -cook -stage -package -archive -pak -iostore -compressed -nop4 -utf8output -unattended -waitmutex -nocompileeditor -nodebuginfo
AdditionalCookerOptions=-CookAgainstFixedBase -DlcLoadMainAssetRegistry

[/Script/GameFeaturePluginsManager.GfpmAssetManager]
; Opt-in, when true normal Package leaves every game feature plugin out of base so each ships as separate removable mod
bExcludeGameFeaturesFromProjectCook=False

[/Script/Engine.WorldPartitionSettings]
; Keep External Data Layer packages out of base world chunk assignment during cook, so mod cook regenerates them into plugin instead of base
bShouldEDLPackagesInheritWorldChunkAssignmentsDuringCook=False
